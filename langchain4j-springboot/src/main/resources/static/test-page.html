<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #fa8c16 0%, #d46b08 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .main-content {
            padding: 40px;
        }

        .test-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid #f0f0f0;
        }

        .section-title {
            font-size: 1.4rem;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .test-button {
            background: linear-gradient(135deg, #1890ff, #096dd9);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px 10px 10px 0;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(24, 144, 255, 0.3);
        }

        .result-area {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 1px solid #e9ecef;
            min-height: 100px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            white-space: pre-wrap;
        }

        .footer {
            text-align: center;
            padding: 30px;
            background: #f8f9fa;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid #e9ecef;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🧪 测试页面</h1>
        <div class="subtitle">各种功能测试集合</div>

        <div class="nav-links">
            <a href="/" class="nav-link">
                🏠 返回首页
            </a>
            <a href="/cache-chat.html" class="nav-link">
                💬 缓存聊天
            </a>
        </div>
    </div>

    <div class="main-content">
        <!-- 健康检查测试 -->
        <div class="test-section">
            <div class="section-title">
                🏥 健康检查测试
            </div>
            <button class="test-button" onclick="testHealthCheck()">
                🚀 测试健康检查
            </button>
            <div class="result-area" id="healthResult">
                点击按钮开始测试...
            </div>
        </div>

        <!-- 缓存统计测试 -->
        <div class="test-section">
            <div class="section-title">
                📊 缓存统计测试
            </div>
            <button class="test-button" onclick="testCacheStats()">
                📈 获取缓存统计
            </button>
            <div class="result-area" id="statsResult">
                点击按钮获取统计信息...
            </div>
        </div>

        <!-- 会话列表测试 -->
        <div class="test-section">
            <div class="section-title">
                📋 会话列表测试
            </div>
            <button class="test-button" onclick="testSessionList()">
                📋 获取会话列表
            </button>
            <div class="result-area" id="sessionResult">
                点击按钮获取会话列表...
            </div>
        </div>

        <!-- 创建会话测试 -->
        <div class="test-section">
            <div class="section-title">
                ➕ 创建会话测试
            </div>
            <button class="test-button" onclick="testCreateSession()">
                ➕ 创建新会话
            </button>
            <div class="result-area" id="createResult">
                点击按钮创建会话...
            </div>
        </div>

        <!-- 普通问答接口测试 -->
        <div class="test-section">
            <div class="section-title">
                💬 普通问答接口测试
            </div>
            <div style="margin-bottom: 15px;">
                <input type="text" id="syncMessageInput" placeholder="请输入测试消息..." style="width: 100%; padding: 12px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 14px;">
            </div>
            <button class="test-button" onclick="testSyncChat()">
                🚀 测试同步问答
            </button>
            <div class="result-area" id="syncResult">
                输入消息并点击按钮开始测试...
            </div>
        </div>

        <!-- 流式响应接口测试 -->
        <div class="test-section">
            <div class="section-title">
                🌊 流式响应接口测试
            </div>
            <div style="margin-bottom: 15px;">
                <input type="text" id="streamMessageInput" placeholder="请输入测试消息..." style="width: 100%; padding: 12px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 14px;">
            </div>
            <button class="test-button" onclick="testStreamChat()" id="streamTestBtn">
                🌊 测试流式响应
            </button>
            <span id="streamLoading" style="display: none; margin-left: 15px; color: #1890ff;">
                    <span style="display: inline-block; width: 12px; height: 12px; border: 2px solid #1890ff; border-radius: 50%; border-top-color: transparent; animation: spin 1s linear infinite; margin-right: 8px;"></span>
                    流式传输中...
                </span>
            <div class="result-area" id="streamResult">
                输入消息并点击按钮开始流式测试...
            </div>
        </div>

        <!-- 带上下文接口测试 -->
        <div class="test-section">
            <div class="section-title">
                🧠 带上下文接口测试
            </div>
            <div style="margin-bottom: 15px;">
                <input type="text" id="contextSystemInput" placeholder="系统提示词..." style="width: 100%; padding: 12px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 14px; margin-bottom: 10px;">
                <input type="text" id="contextUserInput" placeholder="用户消息..." style="width: 100%; padding: 12px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 14px;">
            </div>
            <button class="test-button" onclick="testContextChat()">
                🧠 测试上下文问答
            </button>
            <button class="test-button" onclick="testContextStreamChat()" id="contextStreamBtn">
                🔮 测试上下文流式
            </button>
            <span id="contextStreamLoading" style="display: none; margin-left: 15px; color: #722ed1;">
                    <span style="display: inline-block; width: 12px; height: 12px; border: 2px solid #722ed1; border-radius: 50%; border-top-color: transparent; animation: spin 1s linear infinite; margin-right: 8px;"></span>
                    上下文流式传输中...
                </span>
            <div class="result-area" id="contextResult">
                输入上下文信息并点击按钮开始测试...
            </div>
        </div>
    </div>

    <div class="footer">
        <p>🧪 测试页面 | 用于验证各项功能是否正常工作</p>
        <p>🚀 Powered by Spring Boot & LangChain4j</p>
    </div>
</div>

<script>
    // 健康检查测试
    async function testHealthCheck() {
        const resultArea = document.getElementById('healthResult');
        resultArea.textContent = '正在测试健康检查...';

        try {
            const response = await fetch('/cache-chat/health');
            const data = await response.json();
            resultArea.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
            resultArea.textContent = `错误: ${error.message}`;
        }
    }

    // 缓存统计测试
    async function testCacheStats() {
        const resultArea = document.getElementById('statsResult');
        resultArea.textContent = '正在获取缓存统计...';

        try {
            const response = await fetch('/cache-chat/stats');
            const data = await response.json();
            resultArea.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
            resultArea.textContent = `错误: ${error.message}`;
        }
    }

    // 会话列表测试
    async function testSessionList() {
        const resultArea = document.getElementById('sessionResult');
        resultArea.textContent = '正在获取会话列表...';

        try {
            const response = await fetch('/cache-chat/sessions');
            const data = await response.json();
            resultArea.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
            resultArea.textContent = `错误: ${error.message}`;
        }
    }

    // 创建会话测试
    async function testCreateSession() {
        const resultArea = document.getElementById('createResult');
        resultArea.textContent = '正在创建会话...';

        try {
            const response = await fetch('/cache-chat/sessions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            });
            const data = await response.json();
            resultArea.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
            resultArea.textContent = `错误: ${error.message}`;
        }
    }

    // 普通问答接口测试
    async function testSyncChat() {
        const input = document.getElementById('syncMessageInput');
        const resultArea = document.getElementById('syncResult');
        const message = input.value.trim();

        if (!message) {
            resultArea.textContent = '请输入测试消息';
            return;
        }

        resultArea.textContent = '正在发送同步请求...';

        try {
            const response = await fetch(`/ai/v2/chat?msg=${encodeURIComponent(message)}`);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            const data = await response.text();
            resultArea.textContent = `请求成功！\n响应内容:\n${data}`;
        } catch (error) {
            resultArea.textContent = `错误: ${error.message}`;
        }
    }

    // 流式响应接口测试
    async function testStreamChat() {
        const input = document.getElementById('streamMessageInput');
        const resultArea = document.getElementById('streamResult');
        const streamBtn = document.getElementById('streamTestBtn');
        const loadingIndicator = document.getElementById('streamLoading');
        const message = input.value.trim();

        if (!message) {
            resultArea.textContent = '请输入测试消息';
            return;
        }

        // 禁用按钮，显示加载状态
        streamBtn.disabled = true;
        loadingIndicator.style.display = 'inline-flex';
        resultArea.textContent = '开始流式传输...\n';

        try {
            const eventSource = new EventSource(`/ai/v2/stream?msg=${encodeURIComponent(message)}`);
            let receivedData = '';

            eventSource.onmessage = function(event) {
                if (event.data && event.data !== '[DONE]') {
                    receivedData += event.data;
                    resultArea.textContent = `流式传输中...\n已接收数据:\n${receivedData}`;
                }
            };

            eventSource.onerror = function(error) {
                // 更精确的状态判断逻辑
                const readyState = eventSource.readyState;

                // 如果已经收到数据，说明是正常完成
                if (receivedData.length > 0) {
                    console.log('检测到正常完成，忽略关闭事件');
                    resultArea.textContent += `\n\n✅ 流式传输正常完成！\n总接收字符数: ${receivedData.length}`;
                    eventSource.close();
                    resetStreamButtons();
                    return;
                }

                // 根据readyState判断具体错误类型
                if (readyState === EventSource.CONNECTING) {
                    console.error('连接建立阶段出错:', error);
                    resultArea.textContent += `\n\n❌ 连接建立失败: ${error.type || '网络连接问题'}`;
                } else if (readyState === EventSource.OPEN) {
                    console.error('数据传输阶段出错:', error);
                    resultArea.textContent += `\n\n❌ 数据传输中断: ${error.type || '传输异常'}`;
                } else if (readyState === EventSource.CLOSED) {
                    // CLOSED状态通常是正常关闭
                    console.log('正常关闭连接');
                    resultArea.textContent += `\n\n✅ 流式传输完成！\n总接收字符数: ${receivedData.length}`;
                }

                eventSource.close();
                resetStreamButtons();
            };

            eventSource.onclose = function() {
                resultArea.textContent += `\n\n✅ 流式传输完成！\n总接收字符数: ${receivedData.length}`;
                resetStreamButtons();
            };

            // 10秒超时保护
            setTimeout(() => {
                if (eventSource.readyState !== EventSource.CLOSED) {
                    eventSource.close();
                    resultArea.textContent += `\n\n⏰ 连接超时，已关闭连接`;
                    resetStreamButtons();
                }
            }, 10000);

        } catch (error) {
            resultArea.textContent = `错误: ${error.message}`;
            resetStreamButtons();
        }
    }

    // 重置流式按钮状态
    function resetStreamButtons() {
        document.getElementById('streamTestBtn').disabled = false;
        document.getElementById('streamLoading').style.display = 'none';
    }

    // 添加全局错误处理，避免重复的错误报告
    window.addEventListener('error', function(e) {
        // 过滤掉SSE正常关闭产生的错误
        if (e.message && e.message.includes('EventSource')) {
            console.log('拦截到SSE相关错误，可能是正常关闭:', e.message);
            e.preventDefault();
            return true;
        }
    });

    // 带上下文问答测试
    async function testContextChat() {
        const systemInput = document.getElementById('contextSystemInput');
        const userInput = document.getElementById('contextUserInput');
        const resultArea = document.getElementById('contextResult');

        const systemPrompt = systemInput.value.trim();
        const userMessage = userInput.value.trim();

        if (!systemPrompt || !userMessage) {
            resultArea.textContent = '请输入系统提示词和用户消息';
            return;
        }

        resultArea.textContent = '正在发送带上下文的请求...';

        try {
            const response = await fetch(`/ai/v2/chat-with-context?systemPrompt=${encodeURIComponent(systemPrompt)}&userMessage=${encodeURIComponent(userMessage)}`);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            const data = await response.text();
            resultArea.textContent = `请求成功！
系统提示词: ${systemPrompt}
用户消息: ${userMessage}

响应内容:
${data}`;
        } catch (error) {
            resultArea.textContent = `错误: ${error.message}`;
        }
    }

    // 带上下文流式测试
    async function testContextStreamChat() {
        const systemInput = document.getElementById('contextSystemInput');
        const userInput = document.getElementById('contextUserInput');
        const resultArea = document.getElementById('contextResult');
        const streamBtn = document.getElementById('contextStreamBtn');
        const loadingIndicator = document.getElementById('contextStreamLoading');

        const systemPrompt = systemInput.value.trim();
        const userMessage = userInput.value.trim();

        if (!systemPrompt || !userMessage) {
            resultArea.textContent = '请输入系统提示词和用户消息';
            return;
        }

        // 禁用按钮，显示加载状态
        streamBtn.disabled = true;
        loadingIndicator.style.display = 'inline-flex';
        resultArea.textContent = `开始带上下文的流式传输...
系统提示词: ${systemPrompt}
用户消息: ${userMessage}

`;

        try {
            const eventSource = new EventSource(`/ai/v2/stream-with-context?systemPrompt=${encodeURIComponent(systemPrompt)}&userMessage=${encodeURIComponent(userMessage)}`);
            let receivedData = '';

            eventSource.onmessage = function(event) {
                if (event.data && event.data !== '[DONE]') {
                    receivedData += event.data;
                    resultArea.textContent = `系统提示词: ${systemPrompt}
用户消息: ${userMessage}

流式传输中...
已接收数据:
${receivedData}`;
                }
            };

            eventSource.onerror = function(error) {
                // 更精确的状态判断逻辑
                const readyState = eventSource.readyState;

                // 如果已经收到数据，说明是正常完成
                if (receivedData.length > 0) {
                    console.log('检测到正常完成，忽略关闭事件');
                    resultArea.textContent += `\n\n✅ 上下文流式传输正常完成！\n总接收字符数: ${receivedData.length}`;
                    eventSource.close();
                    resetContextStreamButtons();
                    return;
                }

                // 根据readyState判断具体错误类型
                if (readyState === EventSource.CONNECTING) {
                    console.error('上下文连接建立阶段出错:', error);
                    resultArea.textContent += `\n\n❌ 连接建立失败: ${error.type || '网络连接问题'}`;
                } else if (readyState === EventSource.OPEN) {
                    console.error('上下文数据传输阶段出错:', error);
                    resultArea.textContent += `\n\n❌ 数据传输中断: ${error.type || '传输异常'}`;
                } else if (readyState === EventSource.CLOSED) {
                    // CLOSED状态通常是正常关闭
                    console.log('上下文正常关闭连接');
                    resultArea.textContent += `\n\n✅ 上下文流式传输完成！\n总接收字符数: ${receivedData.length}`;
                }

                eventSource.close();
                resetContextStreamButtons();
            };

            eventSource.onclose = function() {
                resultArea.textContent += `\n\n✅ 上下文流式传输完成！\n总接收字符数: ${receivedData.length}`;
                resetContextStreamButtons();
            };

            // 15秒超时保护
            setTimeout(() => {
                if (eventSource.readyState !== EventSource.CLOSED) {
                    eventSource.close();
                    resultArea.textContent += `\n\n⏰ 连接超时，已关闭连接`;
                    resetContextStreamButtons();
                }
            }, 15000);

        } catch (error) {
            resultArea.textContent = `错误: ${error.message}`;
            resetContextStreamButtons();
        }
    }

    // 重置上下文流式按钮状态
    function resetContextStreamButtons() {
        document.getElementById('contextStreamBtn').disabled = false;
        document.getElementById('contextStreamLoading').style.display = 'none';
    }
</script>
</body>
</html>
