<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 添加图标字体支持 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>带缓存的聊天Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #1890ff;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .main-layout {
            display: flex;
            gap: 20px;
            height: calc(100vh - 150px);
        }

        /* 侧边栏 - 会话列表 */
        .sidebar {
            width: 300px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #f0f0f0;
        }

        .new-session-btn {
            width: 100%;
            background-color: #1890ff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .new-session-btn:hover {
            background-color: #40a9ff;
        }

        .stats-info {
            font-size: 12px;
            color: #666;
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
        }

        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .session-item {
            padding: 12px;
            margin-bottom: 8px;
            background: #fafafa;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #f0f0f0;
            transition: all 0.3s;
        }

        .session-item:hover {
            background: #e6f7ff;
            border-color: #1890ff;
        }

        .session-item.active {
            background: #1890ff;
            color: white;
            border-color: #1890ff;
        }

        .session-name {
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .session-meta {
            font-size: 12px;
            opacity: 0.8;
        }

        .session-actions {
            margin-top: 8px;
            display: flex;
            gap: 5px;
        }

        .session-action-btn {
            padding: 2px 6px;
            font-size: 11px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        .rename-btn {
            background: #52c41a;
            color: white;
        }

        .delete-btn {
            background: #ff4d4f;
            color: white;
        }

        /* 主聊天区域 */
        .chat-area {
            flex: 1;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .current-session {
            font-weight: 500;
            color: #1890ff;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 16px 20px;
            border-radius: 20px;
            position: relative;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            margin-bottom: 12px;
        }

        .message:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        .message::before {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-style: solid;
        }

        .message.user::before {
            left: -12px;
            top: 16px;
            border-width: 6px 12px 6px 0;
            border-color: transparent #1890ff transparent transparent;
        }

        .message.assistant::before {
            right: -12px;
            top: 16px;
            border-width: 6px 0 6px 12px;
            border-color: transparent transparent transparent #f0f0f0;
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #1890ff, #096dd9);
            color: white;
            border-bottom-right-radius: 4px;
            border-top-left-radius: 20px;
        }

        .message.assistant {
            align-self: flex-start;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e7f0 100%);
            color: #333;
            border-bottom-left-radius: 4px;
            border-top-right-radius: 20px;
            border: 1px solid #e8e8e8;
        }

        .message-header {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .message-header i {
            font-size: 14px;
            width: 16px;
            text-align: center;
        }

        .message.user .message-header i {
            color: #fff;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            padding: 2px 4px;
        }

        .message.assistant .message-header i {
            color: #666;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 50%;
            padding: 2px 4px;
        }

        .message-content {
            line-height: 1.5;
        }

        .chat-input-area {
            padding: 20px;
            border-top: 1px solid #f0f0f0;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        textarea {
            flex: 1;
            padding: 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            resize: none;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        textarea:focus {
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
        }

        .send-btn {
            background-color: #1890ff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            align-self: flex-end;
        }

        .send-btn:hover:not(:disabled) {
            background-color: #40a9ff;
        }

        .send-btn:disabled {
            background-color: #d9d9d9;
            cursor: not-allowed;
        }

        /* 加载动画 */
        .loading {
            text-align: center;
            padding: 20px;
            color: #1890ff;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1890ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-layout {
                flex-direction: column;
                height: auto;
            }

            .sidebar {
                width: 100%;
                height: 300px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>💬 带缓存的聊天Demo</h1>
        <p class="subtitle">基于内存缓存的连续对话体验</p>
        <!-- 导航链接 -->
        <div style="margin-top: 15px;">
            <a href="/"
               style="display: inline-block; padding: 8px 16px; background: #1890ff; color: white; text-decoration: none; border-radius: 4px; margin: 0 5px; font-size: 14px;">
                🏠 返回首页
            </a>
        </div>
    </header>

    <div class="main-layout">
        <!-- 侧边栏 - 会话列表 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <button class="new-session-btn" onclick="createNewSession()">
                    ➕ 新建会话
                </button>
                <div class="stats-info" id="statsInfo">
                    加载中...
                </div>
            </div>
            <div class="session-list" id="sessionList">
                <!-- 会话列表将动态生成 -->
            </div>
        </div>

        <!-- 主聊天区域 -->
        <div class="chat-area">
            <div class="chat-header">
                <div class="current-session" id="currentSession">
                    请选择或创建会话开始聊天
                </div>
                <button class="session-action-btn rename-btn" onclick="renameCurrentSession()" id="renameBtn"
                        style="display: none;">
                    重命名
                </button>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="empty-state">
                    <div class="empty-state-icon">💭</div>
                    <p>选择一个会话或创建新会话开始聊天</p>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="input-container">
                        <textarea
                                id="messageInput"
                                placeholder="输入消息..."
                                rows="3"
                                disabled
                                onkeydown="handleKeyDown(event)"
                        ></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
                        发送
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 全局变量
    let currentSessionId = null;
    let sessions = [];

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', function () {
        loadSessions();
        loadStats();
        // 每30秒刷新一次统计信息
        setInterval(loadStats, 30000);
    });

    // 创建新会话
    async function createNewSession() {
        try {
            const response = await fetch('/cache-chat/sessions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            const result = await response.json();
            if (result.success) {
                loadSessions();
                switchToSession(result.sessionId);
                showMessage('✅ 会话创建成功！');
            } else {
                showMessage('❌ ' + result.message);
            }
        } catch (error) {
            showMessage('❌ 创建会话失败：' + error.message);
        }
    }

    // 加载所有会话
    async function loadSessions() {
        try {
            const response = await fetch('/cache-chat/sessions');
            const result = await response.json();

            if (result.success) {
                sessions = result.sessions;
                renderSessionList();
            }
        } catch (error) {
            console.error('加载会话列表失败:', error);
        }
    }

    // 渲染会话列表
    function renderSessionList() {
        const sessionList = document.getElementById('sessionList');

        if (sessions.length === 0) {
            sessionList.innerHTML = `
                    <div class="empty-state">
                        <p>暂无会话</p>
                        <p style="font-size: 12px; margin-top: 5px;">点击上方按钮创建新会话</p>
                    </div>
                `;
            return;
        }

        sessionList.innerHTML = sessions.map(session => `
                <div class="session-item ${session.sessionId === currentSessionId ? 'active' : ''}"
                     onclick="switchToSession('${session.sessionId}')">
                    <div class="session-name">${session.sessionName}</div>
                    <div class="session-meta">
                        ${session.messageCount} 条消息
                    </div>
                    <div class="session-meta">
                        最后访问: ${new Date(session.lastAccessTime).toLocaleString()}
                    </div>
                    <div class="session-actions">
                        <button class="session-action-btn rename-btn"
                                onclick="renameSession('${session.sessionId}', '${session.sessionName}', event)">
                            重命名
                        </button>
                        <button class="session-action-btn delete-btn"
                                onclick="deleteSession('${session.sessionId}', event)">
                            删除
                        </button>
                    </div>
                </div>
            `).join('');
    }

    // 切换到指定会话
    async function switchToSession(sessionId) {
        currentSessionId = sessionId;
        renderSessionList();

        // 更新当前会话显示
        const session = sessions.find(s => s.sessionId === sessionId);
        if (session) {
            document.getElementById('currentSession').textContent = session.sessionName;
            document.getElementById('renameBtn').style.display = 'inline-block';
        }

        // 启用输入框
        document.getElementById('messageInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;

        // 清空聊天区域（关键修改）
        clearChatMessages();

        // 加载会话消息
        await loadSessionMessages();
    }

    // 清空聊天区域
    function clearChatMessages() {
        const chatMessages = document.getElementById('chatMessages');
        chatMessages.innerHTML = `                <div class="empty-state">
                    <div class="empty-state-icon">💭</div>
                    <p>加载消息中...</p>
                </div>
            `;
    }

    // 加载会话消息
    async function loadSessionMessages() {
        if (!currentSessionId) return;

        try {
            const response = await fetch(`/cache-chat/sessions/${currentSessionId}/messages`);
            const result = await response.json();

            if (result.success) {
                renderMessages(result.messages);
            }
        } catch (error) {
            console.error('加载消息失败:', error);
            // 显示错误状态
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = `                    <div class="empty-state">
                        <div class="empty-state-icon">❌</div>
                        <p>加载消息失败</p>
                    </div>
                `;
        }
    }

    // 渲染消息 - 完全重新渲染版本
    function renderMessages(messages) {
        const chatMessages = document.getElementById('chatMessages');

        // 完全清空并重新渲染（关键修改）
        chatMessages.innerHTML = '';

        // 如果没有消息，显示空状态
        if (messages.length === 0) {
            chatMessages.innerHTML = `                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <p>开始对话吧！</p>
                    </div>
                `;
            return;
        }

        // 渲染所有消息
        const messagesHtml = messages.map(msg => `                <div class="message ${msg.role}">
                    <div class="message-header">
                        ${msg.role === 'user' ? '👤 我' : '🤖 助手'}
                        - ${new Date(msg.timestamp).toLocaleString()}                    </div>
                    <div class="message-content">${msg.content}</div>
                </div>
            `).join('');

        chatMessages.innerHTML = messagesHtml;

        // 滚动到底部
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // 发送消息（流式版本）
    async function sendMessage(isStreaming = false) {
        const input = document.getElementById('messageInput');
        const message = input.value.trim();

        console.log('sendMessage called:', {message, currentSessionId, inputValue: input.value});

        if (!message) {
            showMessage('❌ 请输入消息内容');
            return;
        }

        if (!currentSessionId) {
            showMessage('❌ 请先创建会话');
            return;
        }

        // 禁用输入和按钮
        input.disabled = true;
        document.getElementById('sendBtn').disabled = true;
        input.value = '';

        try {
            console.log('开始发送流式消息:', message);
            // 使用流式发送
            await sendStreamMessage(message);
        } catch (error) {
            console.error('发送消息失败:', error);
            showMessage('❌ 发送消息失败：' + error.message);
        } finally {
            // 重新启用输入和按钮
            input.disabled = false;
            document.getElementById('sendBtn').disabled = false;
            input.focus();
        }
    }

    // 处理键盘事件
    function handleKeyDown(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }

    // 重命名会话
    async function renameSession(sessionId, currentName, event) {
        event.stopPropagation(); // 阻止事件冒泡

        const newName = prompt('请输入新的会话名称：', currentName);
        if (!newName || newName.trim() === currentName) return;

        try {
            const response = await fetch(`/cache-chat/sessions/${sessionId}/rename`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({name: newName.trim()})
            });

            const result = await response.json();
            if (result.success) {
                loadSessions();
                showMessage('✅ 会话重命名成功！');
            } else {
                showMessage('❌ ' + result.message);
            }
        } catch (error) {
            showMessage('❌ 重命名失败：' + error.message);
        }
    }

    // 重命名当前会话
    function renameCurrentSession() {
        if (!currentSessionId) return;
        const session = sessions.find(s => s.sessionId === currentSessionId);
        if (session) {
            renameSession(currentSessionId, session.sessionName, {
                stopPropagation: () => {
                }
            });
        }
    }

    // 删除会话
    async function deleteSession(sessionId, event) {
        event.stopPropagation(); // 阻止事件冒泡

        if (!confirm('确定要删除这个会话吗？此操作不可恢复。')) return;

        try {
            const response = await fetch(`/cache-chat/sessions/${sessionId}`, {
                method: 'DELETE'
            });

            const result = await response.json();
            if (result.success) {
                // 如果删除的是当前会话，清空聊天区域
                if (sessionId === currentSessionId) {
                    currentSessionId = null;
                    document.getElementById('currentSession').textContent = '请选择或创建会话开始聊天';
                    document.getElementById('renameBtn').style.display = 'none';
                    document.getElementById('messageInput').disabled = true;
                    document.getElementById('sendBtn').disabled = true;
                    document.getElementById('chatMessages').innerHTML = `
                            <div class="empty-state">
                                <div class="empty-state-icon">💭</div>
                                <p>选择一个会话或创建新会话开始聊天</p>
                            </div>
                        `;
                }

                loadSessions();
                showMessage('✅ 会话删除成功！');
            } else {
                showMessage('❌ ' + result.message);
            }
        } catch (error) {
            showMessage('❌ 删除会话失败：' + error.message);
        }
    }

    // 流式消息发送 - 改进版本
    async function sendStreamMessage(message) {
        console.log('sendStreamMessage called with:', message);

        const responseArea = document.getElementById('chatMessages');
        let accumulatedContent = '';
        let isCompleted = false;
        let errorReported = false;

        // 清空空状态提示（如果存在）
        const emptyState = responseArea.querySelector('.empty-state');
        if (emptyState) {
            responseArea.innerHTML = '';
        }

        // 追加新消息而不是覆盖
        const timestamp = Date.now();
        const userMessageHtml = `<div class="message user"><strong>我:</strong> ${message}</div>`;
        const assistantMessageHtml = `<div class="message assistant"><strong>助手:</strong> <span id="streamContent-${timestamp}" class="streaming-content"></span></div>`;

        responseArea.insertAdjacentHTML('beforeend', userMessageHtml + assistantMessageHtml);

        // 获取刚刚添加的streamContent元素
        const streamContent = responseArea.querySelector('#streamContent-' + timestamp);

        console.log('准备建立EventSource连接');

        try {
            const eventSource = new EventSource(`/cache-chat/sessions/${currentSessionId}/stream-messages?message=${encodeURIComponent(message)}`);

            eventSource.onmessage = function (event) {
                if (event.data && event.data !== '[DONE]') {
                    accumulatedContent += event.data;
                    streamContent.textContent = accumulatedContent;
                    // 滚动到底部
                    if (responseArea) {
                        responseArea.scrollTop = responseArea.scrollHeight;
                    }
                } else if (event.data === '[DONE]') {
                    isCompleted = true;
                    streamContent.textContent = accumulatedContent;
                    eventSource.close();
                    // 恢复输入状态
                    const messageInput = document.getElementById('messageInput');
                    const sendBtn = document.getElementById('sendBtn');
                    if (messageInput) messageInput.disabled = false;
                    if (sendBtn) sendBtn.disabled = false;
                    if (messageInput) messageInput.focus();
                }
            };

            eventSource.onerror = function (error) {
                // 关键逻辑：避免重复报告错误
                if (isCompleted) {
                    // 已经正常完成，不报告错误
                    console.log('缓存聊天流式传输已完成');
                    return;
                }

                if (errorReported) {
                    // 已经报告过错误，避免重复
                    return;
                }

                // 检查连接状态
                if (eventSource.readyState === EventSource.CONNECTING) {
                    console.error('缓存聊天连接建立失败:', error);
                    streamContent.innerHTML += '<br><span style="color: #ff4d4f;">[连接建立失败]</span>';
                    errorReported = true;
                } else if (eventSource.readyState === EventSource.OPEN) {
                    console.error('缓存聊天传输过程中错误:', error);
                    streamContent.innerHTML += '<br><span style="color: #ff4d4f;">[传输中断]</span>';
                    errorReported = true;
                }
                // CLOSED状态不报告错误

                eventSource.close();
            };

            eventSource.onclose = function () {
                console.log('缓存聊天流式连接已关闭');
                if (isCompleted) {
                    // 正常完成，更新会话消息列表
                    loadSessionMessages();
                }
            };

            // 30秒超时保护
            setTimeout(() => {
                if (eventSource.readyState !== EventSource.CLOSED && !isCompleted) {
                    eventSource.close();
                    if (!isCompleted && !errorReported) {
                        streamContent.innerHTML += '<br><span style="color: #faad14;">[连接超时]</span>';
                        errorReported = true;
                    }
                }
            }, 30000);

        } catch (error) {
            streamContent.innerHTML = `错误: ${error.message}`;
            throw error;
        }
    }

    // 保存消息到会话（流式传输完成后调用）
    async function saveMessageToSession(userMessage, aiReply) {
        if (!currentSessionId) return;

        try {
            const response = await fetch(`/cache-chat/sessions/${currentSessionId}/save-messages`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    userMessage: userMessage,
                    aiReply: aiReply
                })
            });

            const result = await response.json();
            if (result.success) {
                console.log('消息保存成功');
                // 重新加载会话消息以更新显示
                await loadSessionMessages();
            } else {
                console.error('保存消息失败:', result.message);
            }
        } catch (error) {
            console.error('保存消息异常:', error);
        }
    }

    // 加载统计信息
    async function loadStats() {
        try {
            const response = await fetch('/cache-chat/stats');
            const result = await response.json();

            if (result.success) {
                const stats = result.stats;
                document.getElementById('statsInfo').innerHTML = `
                        📊 统计信息<br>
                        总会话数: ${stats.totalSessions}<br>
                        活跃会话: ${stats.activeSessions}<br>
                        过期会话: ${stats.expiredSessions}<br>
                        缓存容量: ${stats.maxCacheSize}
                    `;
            }
        } catch (error) {
            console.error('加载统计信息失败:', error);
        }
    }

    // 显示消息提示
    function showMessage(text) {
        // 创建临时提示元素
        const toast = document.createElement('div');
        toast.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: white;
                border: 1px solid #d9d9d9;
                border-radius: 4px;
                padding: 12px 20px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.15);
                z-index: 1000;
                font-size: 14px;
            `;
        toast.textContent = text;
        document.body.appendChild(toast);

        // 3秒后自动移除
        setTimeout(() => {
            document.body.removeChild(toast);
        }, 3000);
    }
</script>
</body>
</html>
