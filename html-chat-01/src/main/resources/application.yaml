server:
  port: 0

spring:
  application:
    name: activemq-demo
    version: '@project.version@'
  profiles:
    active: '@profiles.active@'
    include: core,web

platform:
  resilience:
    isHotWarmModel: false
  cache-manager:
    config:
      # Default storage backend
      default-store: mongo

      # Auto refresh interval (seconds before expire)
      auto-refresh-interval: 60

      # Alarm time for expiration warning (seconds before expire)
      alarm-time: 120

      # Local cache settings
      enable-local-cache: true
      local-cache-max-size: 1000

      # Request merge settings
      enable-request-merge: true

      # Lock settings
      lock:
        type: local  # LOCAL or REDIS
        expire-seconds: 30

      # MongoDB configuration
      mongo:
        uri: mongodb://data.luopc.com:27017
        database: test_db
        username: admin
        password: ENC(fPAkFSYA4QhwYfhaYz3f9o8l3OIjS0gd)
        enable-ttl-cleanup: true
        cleanup-interval-seconds: 3600

---
spring:
  config:
    activate:
      on-profile: dev
server:
  port: 0

---
spring:
  config:
    activate:
      on-profile: local
server:
  port: 8082

---
spring:
  config:
    activate:
      on-profile: uat
server:
  port: 8980

